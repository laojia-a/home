<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light"><title>JCLAW TV · S10 节目精修</title><link rel="icon" href="data:,"><link rel="stylesheet" href="src/styles/s10.css"><link rel="stylesheet" href="src/styles/refinements.css"><link rel="stylesheet" href="src/styles/tv-shell.css"></head><body>

<main>
  <div class="screenCol">
    <div class="screen" id="screen" tabindex="0" aria-label="电视节目。左右方向键换台，回车打开工具。">
      <section class="channel" data-ch="1"><canvas class="fill" id="cv1"></canvas></section>
      <section class="channel" data-ch="2"><canvas class="fill" id="cv2"></canvas></section>
      <section class="channel" data-ch="3"><canvas class="fill" id="cv3"></canvas></section>
      <section class="channel" data-ch="4"><canvas class="fill" id="cv4"></canvas></section>
      <section class="channel" data-ch="5"><canvas class="fill" id="cv5"></canvas></section>
      <section class="channel" data-ch="6"><canvas class="fill" id="cv6"></canvas></section>
      <section class="channel" data-ch="7"><canvas class="fill" id="cv7"></canvas></section>
      <canvas id="wipe"></canvas>
      <div class="crt-scan" id="crtScan"></div>
      <div class="crt-vig" id="crtVig"></div>
      <div class="standby" id="standby"></div>
      <div class="site-identity" id="siteIdentity"><img id="siteMark" alt=""><span><strong id="siteName"></strong><small id="siteScene"></small></span></div>
      <div class="power-wake" id="powerWake" hidden><button data-action="power">开启电视</button></div>
      <p id="canvasAlt" class="sr-only" aria-live="polite"></p>
      <div id="menu" hidden>
        <section class="m-box" role="dialog" aria-modal="true" aria-labelledby="menuTitle" tabindex="-1">
          <div class="m-head"><strong id="menuTitle">MENU <em>节目与设置</em></strong><button data-action="close-menu" class="menu-close" aria-label="关闭菜单">×</button></div>
          <div class="m-tabs" role="tablist"><button role="tab" data-tab="guide">频道</button><button role="tab" data-tab="pic">画面</button><button role="tab" data-tab="link">接入</button><button role="tab" data-tab="more">更多</button></div>
          <div class="m-body" id="mBody" role="tabpanel"></div>
        </section>
      </div>
    </div>
  </div>
</main>

<nav class="mobileDock" aria-label="移动端播放控制"><button data-action="power">电源</button><button data-action="channel-prev">CH −</button><button data-action="play" id="mobilePlay">暂停</button><button data-action="channel-next">CH +</button><button data-action="menu">更多</button></nav><div class="toast" id="toast" role="status"></div>

<script type="module" src="src/runtime.js"></script></body></html>
