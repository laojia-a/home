<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>__NAME__ · 动画独立预览</title><style>*{box-sizing:border-box}body{margin:0;background:#eae6db;color:#334037;font:14px "PingFang SC","Microsoft YaHei",sans-serif}header,footer{max-width:1100px;margin:auto;padding:18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}h1{font-size:20px;margin:0 auto 0 0}canvas{display:block;width:min(calc(100% - 32px),1100px);aspect-ratio:16/9.3;margin:8px auto;border:8px solid #f5f1e6;border-radius:5px;box-shadow:0 10px 30px #51453124}button,select{font:inherit;background:#f5f1e6;color:inherit;border:1px solid #aaa78e;border-radius:4px;padding:9px}input{flex:1;min-width:120px}small{font-size:12px;color:#757966}a{color:inherit}@media(max-width:600px){canvas{aspect-ratio:4/5}header,footer{padding:14px}h1{font-size:18px;width:100%}small{width:100%}}</style><body data-site="__SITE__"><header><h1>__NAME__</h1><select aria-label="节目分幕"></select><button id="play">暂停</button><button id="reset">从头</button><a href="../index.html">返回电视</a></header><canvas aria-label="网站节目动画"></canvas><footer><input aria-label="节目时间" type="range" min="0" max="1000" value="0"><output id="status"></output><small>开发预览使用正式 TV 的同一网站模块与绘制实例；不是实机录屏或直播。</small></footer><script>__SCRIPT__</script></body></html>
