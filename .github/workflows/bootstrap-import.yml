name: Import verified S10 source
on:
  push:
    paths:
      - '.bootstrap/payload.json'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify and extract source payload
        run: python3 .bootstrap/import.py
      - name: Validate imported project
        run: npm run check
      - name: Install browser test tooling
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Validate actual pages and animation equivalence
        run: |
          python tests/browser.py --content --artifacts /tmp/jclaw-home-qa
          python tests/parity.py --artifacts /tmp/jclaw-home-qa
          python tests/collection.py --artifacts /tmp/jclaw-home-qa
      - name: Commit verified source without overwriting concurrent changes
        env:
          EXPECTED_PARENT: ${{ github.sha }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_PARENT"
          git add -A
          git commit -m "feat: import S10 baseline with modular animation and settings"
          git push origin HEAD:main
