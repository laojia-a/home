name: Import verified S10 source
on:
  push:
    paths:
      - '.bootstrap/payload.json'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and extract source payload
        run: python3 .bootstrap/import.py
      - name: Validate imported project
        run: |
          npm test
          python3 scripts/build.py
          python3 scripts/verify.py
      - name: Commit verified source without overwriting concurrent changes
        env:
          EXPECTED_PARENT: ${{ github.sha }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_PARENT"
          git add -A
          git commit -m "feat: import S10 programme baseline and modular animation/settings architecture"
          git push origin HEAD:main
