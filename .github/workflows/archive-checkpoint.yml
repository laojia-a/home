name: Archive continuation checkpoint
on:
  push:
    branches: ['archive/context-assets-20260915']
    paths: ['.github/workflows/archive-checkpoint.yml']
permissions:
  contents: read
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Export exact repository files without credentials or Git metadata
        run: |
          git archive --format=zip HEAD -o /tmp/home-checkpoint.zip
          git rev-parse HEAD > /tmp/home-checkpoint-commit.txt
          sha256sum /tmp/home-checkpoint.zip > /tmp/home-checkpoint-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: home-archive-continuation
          path: |
            /tmp/home-checkpoint.zip
            /tmp/home-checkpoint-commit.txt
            /tmp/home-checkpoint-sha256.txt
          retention-days: 1
          if-no-files-found: error
