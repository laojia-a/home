name: Recover original cinematic SVG assets
on:
  push:
    branches: ['archive/context-assets-20260915']
    paths: ['.motion-intake/READY.json']
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recover pinned historical sources and exact SVG bytes
        run: python3 scripts/restore_cinematic.py
      - name: Validate current seven-site source and frozen baseline
        run: npm run check
      - name: Install browser test tooling
        run: |
          python3 -m pip install playwright==1.56.0
          python3 -m playwright install --with-deps chromium
      - name: Test original SVG motion and unchanged production player
        shell: bash
        run: |
          mkdir -p /tmp/home-motion-qa
          python3 tests/archived_svg.py --artifacts /tmp/home-motion-qa
          python3 tests/browser.py --content --artifacts /tmp/home-motion-qa
          python3 tests/parity.py --artifacts /tmp/home-motion-qa
          git diff --exit-code HEAD -- src index.html reference baseline
      - name: Retain actual validation evidence and remove transient small payload
        run: |
          mkdir -p docs/evidence/cinematic-recovery-20260915
          cp /tmp/home-motion-qa/*.json /tmp/home-motion-qa/*.png docs/evidence/cinematic-recovery-20260915/
          printf '%s\n' "$GITHUB_SHA" > docs/evidence/cinematic-recovery-20260915/source-commit.txt
          printf '%s\n' "$GITHUB_RUN_ID" > docs/evidence/cinematic-recovery-20260915/workflow-run.txt
          rm -r .motion-intake
          python3 scripts/restore_cinematic.py
      - name: Commit verified recovered assets without overwriting concurrent work
        env:
          EXPECTED_PARENT: ${{ github.sha }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse "origin/$GITHUB_REF_NAME")" = "$EXPECTED_PARENT"
          git add -- archive/reuse/cinematic-original docs/evidence/cinematic-recovery-20260915 .motion-intake
          git diff --cached --name-only | grep -vE '^(archive/reuse/cinematic-original/|docs/evidence/cinematic-recovery-20260915/|\.motion-intake/)' > /tmp/unexpected-motion-paths || true
          test ! -s /tmp/unexpected-motion-paths
          git commit -m "archive: restore 16 original SVG animations with reproducible source and browser evidence"
          git push origin "HEAD:$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cinematic-recovery-evidence
          path: /tmp/home-motion-qa
          retention-days: 7
          if-no-files-found: ignore
