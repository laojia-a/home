name: TV preview
on:
  pull_request:
    paths: ['src/**', 'scripts/**', 'tests/**', '.github/workflows/tv-preview.yml']
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - name: Package exact review sources and runnable HTML
        run: |
          mkdir -p /tmp/tv-preview
          git archive --format=zip HEAD -o /tmp/tv-preview/source.zip
          cp dist/index.html /tmp/tv-preview/index.html
          cp dist/build-manifest.json /tmp/tv-preview/build-manifest.json
          git rev-parse HEAD > /tmp/tv-preview/COMMIT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: tv-preview
          path: /tmp/tv-preview
          retention-days: 7
