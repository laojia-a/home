<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light"><title>JCLAW TV · 正面纵深版</title><link rel="icon" href="data:,"><style>
:root{ --grn:#24eb4f; --grn2:#149a3e; --mut:#968f7f; }
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{
  background:#eae6db;color:#2c2a26;height:100vh;display:flex;flex-direction:column;
  font-family:"PingFang SC","Microsoft YaHei",-apple-system,sans-serif;
  background-image:
    radial-gradient(ellipse at 50% 0%, rgba(255,255,255,.55), transparent 60%),
    repeating-linear-gradient(90deg, rgba(120,100,60,.035) 0 2px, transparent 2px 7px);
}
.topbar{display:flex;align-items:center;gap:20px;padding:14px 22px 12px;
  border-bottom:1px solid #d3ccbb}
.brand{display:flex;align-items:center;gap:10px}
#brandPix{height:26px;image-rendering:pixelated}
.topbar .net{font-size:10px;letter-spacing:.4em;color:var(--mut);text-transform:uppercase}
#clock{margin-left:auto;font-family:"Courier New",monospace;font-size:13px;
  letter-spacing:.14em;color:#7c7668}
#clock b{color:var(--grn2)}

main{flex:1;display:flex;min-height:0}
.screenCol{flex:1;display:grid;place-items:center;padding:22px;min-width:0}
.screen{
  position:relative;width:min(100%,calc((100vh - 170px)*1.72));aspect-ratio:16/9.3;
  background:#000;border:1px solid #3a3733;border-radius:6px;overflow:hidden;cursor:pointer;
  box-shadow:0 0 0 10px #f5f1e6, 0 0 0 12px #c6bfae, 0 26px 60px rgba(80,68,45,.38);
}
.crt-scan{position:absolute;inset:0;z-index:40;pointer-events:none;
  background:repeating-linear-gradient(0deg, rgba(0,0,0,.14) 0 1px, transparent 1px 3px)}
.crt-vig{position:absolute;inset:0;z-index:41;pointer-events:none;
  background:radial-gradient(ellipse at center, transparent 58%, rgba(0,0,0,.42) 100%)}
.channel{filter:brightness(var(--bri,1))}
.channel{position:absolute;inset:0;opacity:0;transition:opacity .1s}
.channel.on{opacity:1}
canvas.fill{position:absolute;inset:0;width:100%;height:100%}
#wipe{position:absolute;inset:0;z-index:45;width:100%;height:100%;opacity:0;pointer-events:none}
#osd{position:absolute;left:16px;top:14px;z-index:50;opacity:0;transition:opacity .25s;
  display:flex;align-items:center;gap:12px;background:rgba(0,0,0,.72);padding:5px 13px;
  border-left:3px solid var(--grn)}
#osd.show{opacity:1}
#osd canvas{image-rendering:pixelated;height:30px}
.liveTag{position:absolute;right:16px;top:16px;z-index:50;display:flex;align-items:center;gap:7px;
  font-size:11px;font-weight:800;letter-spacing:.26em;color:#fff}
.liveTag i{width:8px;height:8px;border-radius:50%;background:var(--grn);
  box-shadow:0 0 10px var(--grn);animation:pul 1.2s steps(2) infinite}
@keyframes pul{50%{opacity:.2}}
.standby{position:absolute;right:16px;top:16px;z-index:50;display:none;
  font-size:11px;font-weight:700;letter-spacing:.26em;color:#f5e6b8;
  border:1px solid rgba(245,230,184,.5);padding:4px 10px}

/* ================= 遥控器 ================= */
.rail{width:250px;flex:none;display:flex;flex-direction:column;align-items:center;
  padding:18px 0 12px;overflow-y:auto}
.rc{width:172px;border-radius:30px;padding:16px 14px 14px;position:relative;
  background:linear-gradient(160deg,#3b3b44,#26262c 55%,#1d1d22);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.16), inset 0 -2px 6px rgba(0,0,0,.5),
    0 18px 40px rgba(60,50,30,.4), 0 3px 8px rgba(60,50,30,.25);
  display:flex;flex-direction:column;align-items:center;gap:12px}
.rc-ir{width:56px;height:12px;border-radius:7px;background:#101014;
  box-shadow:inset 0 1px 3px #000, 0 1px 0 rgba(255,255,255,.08);position:relative}
.rc-ir i{position:absolute;right:5px;top:3px;width:6px;height:6px;border-radius:50%;
  background:#5a1414;transition:.1s}
.rc-ir.tx i{background:#ff3b30;box-shadow:0 0 8px #ff3b30}
.rc-brand{font-size:9px;letter-spacing:.5em;color:#71717c;font-weight:700;text-indent:.5em}
.rc-pwr{width:40px;height:40px;border-radius:50%;border:0;cursor:pointer;
  background:radial-gradient(circle at 35% 30%,#5b2730,#3a1a20 70%);
  box-shadow:0 2px 5px rgba(0,0,0,.55), inset 0 1px 1px rgba(255,255,255,.22);
  display:grid;place-items:center;transition:.08s}
.rc-pwr:active{transform:translateY(1px);box-shadow:0 1px 2px rgba(0,0,0,.6), inset 0 2px 4px rgba(0,0,0,.5)}
.rc-pwr svg{width:16px;height:16px;stroke:#ff8a80;fill:none;stroke-width:2;stroke-linecap:round}
.rc-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.rc-ch{width:38px;height:38px;border-radius:50%;border:0;cursor:pointer;position:relative;
  background:radial-gradient(circle at 35% 30%,#4d4d56,#33333a 72%);
  box-shadow:0 2px 4px rgba(0,0,0,.55), inset 0 1px 1px rgba(255,255,255,.18);
  color:#d8d8de;font:800 13px "Courier New",monospace;transition:.08s}
.rc-ch:active{transform:translateY(1px);box-shadow:0 1px 2px rgba(0,0,0,.6), inset 0 2px 4px rgba(0,0,0,.5)}
.rc-ch::after{content:"";position:absolute;left:50%;bottom:4px;transform:translateX(-50%);
  width:5px;height:5px;border-radius:50%;background:var(--cc,#666);opacity:.9}
.rc-ch.off{color:#6a6a72}
.rc-ch.off::after{background:#4a4a50}
.rc-ch.cur{box-shadow:0 0 0 2px var(--cc,#888), 0 2px 4px rgba(0,0,0,.55);
  color:#fff}
.rc-ch.ghost{width:38px;height:38px;visibility:hidden}
.rc-dual{display:flex;gap:26px}
.rc-col{display:flex;flex-direction:column;align-items:center;gap:5px}
.rc-col span{font-size:8.5px;letter-spacing:.24em;color:#71717c;font-weight:700}
.rc-col button{width:34px;height:26px;border:0;cursor:pointer;border-radius:13px;
  background:radial-gradient(circle at 35% 30%,#4d4d56,#33333a 72%);
  box-shadow:0 2px 4px rgba(0,0,0,.55), inset 0 1px 1px rgba(255,255,255,.18);
  color:#d8d8de;font:800 13px "Courier New",monospace;transition:.08s}
.rc-col button:active{transform:translateY(1px);box-shadow:0 1px 2px rgba(0,0,0,.6), inset 0 2px 4px rgba(0,0,0,.5)}
.rc-menu{width:100%;height:32px;border:0;cursor:pointer;border-radius:16px;
  background:linear-gradient(180deg,#3f4a42,#2c352e);
  box-shadow:0 2px 4px rgba(0,0,0,.55), inset 0 1px 1px rgba(255,255,255,.18);
  color:#b8f5c8;font:700 11px "PingFang SC",sans-serif;letter-spacing:.22em;transition:.08s}
.rc-menu:active{transform:translateY(1px)}
.rc-menu.on{background:linear-gradient(180deg,#2a7a45,#1d5c33);color:#fff}
.rc-foot{font-size:8px;letter-spacing:.3em;color:#5b5b64;text-align:center;line-height:1.9}
.rl-foot{margin-top:12px;font-size:10.5px;color:#8f8878;line-height:2;letter-spacing:.08em;text-align:center}
.rl-foot b{color:#6e685b;border:1px solid #c6bfae;border-radius:3px;padding:0 5px;
  font-family:"Courier New",monospace;background:#f6f3ea}

/* ================= 设置菜单 OSD ================= */
#menu{position:absolute;inset:0;z-index:60;display:none;
  background:rgba(8,12,20,.78);backdrop-filter:blur(2px);
  align-items:center;justify-content:center}
#menu.show{display:flex}
.m-box{width:min(620px,86%);max-height:86%;display:flex;flex-direction:column;
  background:linear-gradient(180deg,rgba(16,22,34,.97),rgba(10,14,24,.97));
  border:1px solid rgba(120,180,255,.22);border-radius:8px;overflow:hidden;
  box-shadow:0 20px 60px rgba(0,0,0,.6);color:#dce6f2}
.m-head{display:flex;align-items:baseline;gap:12px;padding:13px 18px;
  border-bottom:1px solid rgba(120,180,255,.16);
  font:800 14px "PingFang SC",sans-serif;letter-spacing:.18em;color:#9fc6ff}
.m-head span{margin-left:auto;font-size:10px;color:#5f748f;letter-spacing:.1em;font-weight:400}
.m-tabs{display:flex;gap:2px;padding:8px 18px 0}
.m-tabs b{padding:6px 14px;font-size:12px;cursor:pointer;color:#7f93ab;font-weight:600;
  border-radius:5px 5px 0 0;border:1px solid transparent;border-bottom:0}
.m-tabs b.on{color:#fff;background:rgba(90,140,220,.16);border-color:rgba(120,180,255,.25)}
.m-body{padding:14px 18px 16px;overflow-y:auto;border-top:1px solid rgba(120,180,255,.16)}
.m-row{display:flex;align-items:center;gap:10px;padding:7px 0;
  border-bottom:1px dashed rgba(120,180,255,.1)}
.m-row i{width:10px;height:10px;border-radius:2px;flex:none}
.m-row .m-ch{font:800 11px "Courier New",monospace;color:#8ba3c0;width:30px;flex:none}
.m-row .m-nm{font-size:12.5px;font-weight:700;width:104px;flex:none;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-row input{flex:1;min-width:0;background:rgba(255,255,255,.06);border:1px solid rgba(120,180,255,.2);
  border-radius:4px;color:#dce6f2;font:12px "Courier New",monospace;padding:5px 8px;outline:none}
.m-row input:focus{border-color:#6fb2ff;background:rgba(255,255,255,.1)}
.m-row input::placeholder{color:#4d6076}
.m-tg{flex:none;width:64px;height:22px;border-radius:11px;border:1px solid rgba(120,180,255,.25);
  background:rgba(255,255,255,.05);color:#7f93ab;font:700 10px "PingFang SC",sans-serif;
  letter-spacing:.08em;cursor:pointer}
.m-tg.on{background:rgba(36,235,79,.16);border-color:rgba(36,235,79,.5);color:#4ef58a}
.m-act{display:flex;gap:10px;margin-top:14px}
.m-act button{flex:1;height:32px;border-radius:6px;border:1px solid rgba(120,180,255,.3);
  background:rgba(90,140,220,.14);color:#cfe2ff;font:700 12px "PingFang SC",sans-serif;
  letter-spacing:.12em;cursor:pointer}
.m-act button:hover{background:rgba(90,140,220,.26)}
.m-act button#mReset{background:rgba(255,255,255,.04);color:#7f93ab}
.m-pic{display:flex;align-items:center;gap:12px;padding:10px 0;
  border-bottom:1px dashed rgba(120,180,255,.1);font-size:13px}
.m-pic .m-tg{margin-left:auto}
.m-pic output{margin-left:auto;font:700 12px "Courier New",monospace;color:#9fc6ff;min-width:44px;text-align:right}
.m-pic button.vb{width:28px;height:24px;border-radius:6px;border:1px solid rgba(120,180,255,.25);
  background:rgba(255,255,255,.06);color:#dce6f2;cursor:pointer;font:800 13px "Courier New",monospace}
.m-about{font-size:12.5px;line-height:2.2;color:#a9bcd2;letter-spacing:.06em}
.m-about b{color:#fff;font-family:"Courier New",monospace}

.sw{position:fixed;right:14px;bottom:12px;z-index:99;display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.sw a{width:26px;height:26px;display:grid;place-items:center;border-radius:6px;
  background:#f6f3ea;color:#8f8878;text-decoration:none;font-size:10.5px;font-weight:700;
  border:1px solid #d5cfbe;transition:.15s;font-family:"Courier New",monospace}
.sw a:hover{color:var(--grn2);border-color:var(--grn2)}
.sw a.cur{color:#fff;background:var(--grn2);border-color:var(--grn2)}
@media (max-width:860px){ .rail{display:none} }

/* The accepted cream TV, with real CSS depth. Programme colours remain untouched. */
:root { --tv-cream:#f4ecdd; --tv-ink:#393b34; --tv-edge:#9a8a73; --tv-focus:#426951; --tv-mono:'Courier New',monospace; }
html { overflow:auto; }
body { min-height:100svh; height:100dvh; overflow:auto; color:var(--tv-ink); background:#eeeae2 radial-gradient(ellipse at 26% 16%,#fffcf5 0,transparent 66%); }
.topbar { min-height:64px; padding:14px 32px; gap:22px; border-bottom-color:#65584412; }
.topbar .net { letter-spacing:.18em; color:#847c6c; }
#clock { font-size:11px; letter-spacing:.06em; color:#847c6c; }
#clock b { color:#586f52; font-weight:600; }
.top-more { min-height:36px; padding-inline:14px; border-radius:8px; background:#f9f5ed; border-color:#bfb4a3; color:#495342; }
main { align-items:stretch; padding:0; }
.rail { display:none !important; }
.screenCol { padding:75px 86px 91px 50px; min-width:0; }
/* Front elevation: programme plane stays orthogonal to the viewer.
   Only non-interactive rear geometry is projected by (+36, -11) CSS px.
   No camera rotation, perspective on ancestors, or pointer-driven view transforms. */
.tv-set { --depth-x:36px; --depth-y:-11px; position:relative; width:min(1130px,100%,calc((100dvh - 300px)*1.72043 + 212px)); perspective:none; isolation:isolate; }
.tv-volume { position:relative; transform:none; transform-style:flat; isolation:isolate; }
.tv-ground { position:absolute; z-index:-1; left:5%; right:-1%; height:62px; bottom:-49px; border-radius:50%; background:radial-gradient(ellipse at center,#51422e38 0%,#68533c1c 43%,transparent 72%); filter:blur(7px); pointer-events:none; }
.tv-ground::before { content:''; position:absolute; left:5%; right:5%; top:22px; height:15px; border-radius:50%; background:radial-gradient(ellipse,#483b2730,transparent 70%); }
.tv-depth { position:absolute; z-index:0; inset:0; pointer-events:none; }
.tv-depth i { position:absolute; inset:calc(var(--layer)*.16px); border-radius:48px 48px 40px 40px / 44px 46px 38px 40px; background:linear-gradient(155deg,#f1e7d6 0%,#ddcfb6 40%,#c7b595 100%); border:1px solid #b2a08338; transform:translate(calc(var(--layer)*var(--depth-x)/12),calc(var(--layer)*var(--depth-y)/12)); }
.tv-depth i:first-child { border-color:#a9987d; box-shadow:5px 12px 18px #63503917; }
.tv-depth i:last-child { border-color:#928068; }
.tv-side { position:absolute; z-index:1; left:calc(100% - 3px); top:43px; bottom:42px; width:calc(var(--depth-x) - 1px); transform-origin:left center; transform:skewY(-17deg); background:linear-gradient(90deg,#d1c1a2,#daccb1 26%,#c8b795 97%); border:1px solid #b4a07e; border-left:0; border-radius:1px 5px 5px 1px; pointer-events:none; }
.tv-side::after { content:''; position:absolute; top:8px; bottom:7px; right:4px; width:1px; background:#9e8b6e55; box-shadow:1px 0 #eee2cd80; }
.tv-vents { position:absolute; inset:23% 8px auto 7px; display:grid; gap:9px; }
.tv-vents i { display:block; height:4px; border-radius:3px; background:linear-gradient(#6c614c,#8b7b60); border:1px solid #78694f; box-shadow:0 1px 0 #f4e5c8,inset 0 1px 1px #4f4639; }
.tv-side-label { display:none; }
.tv-side-label span { font-size:7px; letter-spacing:.03em; }
.tv-screw { position:absolute; bottom:23px; left:13px; width:5px; height:5px; border:1px solid #8a7a60; border-radius:50%; background:linear-gradient(90deg,#c2b293 45%,#746854 46% 56%,#eadfc8 57%); }
.tv-cabinet { position:relative; z-index:3; display:grid; grid-template-columns:minmax(0,1fr) 126px; gap:0 22px; padding:23px 26px 0 23px; border:1.5px solid var(--tv-edge); border-radius:48px 48px 40px 40px / 44px 46px 38px 40px; background:linear-gradient(137deg,#fffaf1,var(--tv-cream) 42%,#e7dcc7); box-shadow:inset 0 3px 1px #fffdf6,inset 2px 0 2px #ffffff99,inset -4px -5px 1px #d4c4a7,1px 2px 0 1px #9e8b70,2px 4px 3px #5e4c3326; transform:none; }
.tv-cabinet::before { content:''; position:absolute; inset:6px 8px 7px 6px; border:1px solid #9b8a704d; border-radius:42px 43px 34px 35px / 38px 40px 32px 34px; pointer-events:none; }
.tv-handle { position:absolute; top:-37px; left:30%; width:27%; height:54px; border:8px solid #947143; border-bottom:0; border-radius:90px 105px 0 0 / 48px 51px 0 0; background:transparent; box-shadow:inset 0 2px 0 #dbbc83,0 -1px 0 1px #654c31,2px -4px 0 #b49762; transform:translate(8px,-4px); z-index:2; }
.tv-aerial { position:absolute; right:11%; top:-67px; width:100px; height:75px; transform:translate(14px,-5px); z-index:2; }
.tv-aerial i { position:absolute; width:4px; height:72px; bottom:0; left:49px; transform-origin:center bottom; transform:rotate(-29deg); border:1px solid #8a8275; border-radius:4px; background:linear-gradient(90deg,#7e796f,#f6f2e9 54%,#69645c); }
.tv-aerial i+i { height:89px; transform:rotate(29deg); }
.tv-aerial i::before { content:''; position:absolute; top:-5px; left:-4px; width:9px; height:9px; border:1px solid #827a6e; border-radius:50%; background:radial-gradient(circle at 30% 26%,white,#93897b 68%); }
.tv-aerial b { position:absolute; left:37px; bottom:-6px; width:30px; height:14px; border-radius:50% 50% 3px 3px; border:1px solid #9c8d74; background:linear-gradient(#e6ddc8,#b4a589); }
.tv-glass-surround { position:relative; align-self:center; padding:13px; border:1px solid #665e4c; border-radius:40px 42px 36px 38px / 38px 40px 34px 35px; background:linear-gradient(136deg,#292c27,#625e50 43%,#202820 72%,#514f42); box-shadow:inset 2px 5px 6px #14170f99,inset -1px -2px 1px #b9ac94,0 1px 0 2px #fffbeb,0 -1px 0 2px #c5b99e; }
.tv-glass-surround::before { content:''; position:absolute; inset:5px; border:1px solid #c7b89b60; border-radius:35px 37px 31px 33px; pointer-events:none; }
.tv-set .screen { display:block; width:100%; max-width:none; aspect-ratio:16 / 9.3; border:1px solid #182018; border-radius:28px 30px 26px 27px / 31px 33px 25px 26px; box-shadow:0 2px 2px #0008,inset 0 0 12px #07180b24; touch-action:pan-y pinch-zoom; }
.tv-set .screen::after { background:linear-gradient(132deg,#ffffff0d,transparent 24%,transparent 82%,#ffffff05); box-shadow:inset 0 0 0 1px #fffff035,inset 3px 5px 12px #1321182c,inset -1px -1px 6px #09140c19; }
.tv-set .screen::before { content:''; position:absolute; z-index:42; left:4%; top:2.5%; width:23%; height:6%; border-radius:90% 14% 100% 0; background:linear-gradient(168deg,#ffffff30,#ffffff03 65%); transform:rotate(-7deg); pointer-events:none; }
.channel.on { transform:none; }
.crt-scan { opacity:.05; }
.crt-vig { opacity:.12; }
.tv-console { position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:0 0 1px; color:#554d40; }
.tv-channel-window { display:flex; align-items:center; justify-content:center; gap:8px; min-width:85px; padding:5px 9px; border-radius:6px; background:linear-gradient(120deg,#1d3027,#314633); color:#e3e2c6; border:1px solid #35362c; box-shadow:inset 0 3px 4px #111b1266,0 1px 0 #fff,0 0 0 2px #c8baa0; }
.tv-channel-window span { font:9px var(--tv-mono); letter-spacing:.14em; color:#afbea0; }
.tv-channel-window strong { font:700 22px/1 var(--tv-mono); }
.tv-channel-window i { width:3px; height:3px; border-radius:50%; background:#bfce9c; box-shadow:0 0 3px #bace8b66; }
.tv-tuner { position:relative; width:118px; height:108px; display:grid; place-items:center; margin-top:5px; }
.tv-dial-marks { position:absolute; inset:0; pointer-events:none; }
.tv-dial-marks i { position:absolute; left:53px; top:46px; width:12px; height:12px; text-align:center; transform:rotate(var(--mark)) translateY(-49px) rotate(calc(-1*var(--mark))); font:10px var(--tv-mono); color:#8f806a; }
.tv-dial-marks .active { color:#394d32; font-weight:700; }
.tv-dial { position:relative; width:78px; height:78px; border:1px solid #71614e; border-radius:50%; background:repeating-conic-gradient(#a28c69 0deg 2deg,#dfc9a2 3deg 7deg); box-shadow:1px 2px 0 #aa926b,2px 4px 0 #b79d73,3px 6px 0 #a58b61,4px 8px 0 #8d7655,4px 9px 0 1px #6d5c44,5px 12px 9px #46372829; touch-action:none; cursor:ew-resize; transition:translate 120ms,box-shadow 120ms; }
.tv-dial::before { content:''; position:absolute; inset:5px; border:1px solid #b29460; border-radius:50%; background:radial-gradient(circle at 30% 22%,#f4dcb0,#dabb84 68%,#c29c62); box-shadow:inset 0 2px 1px #fff1cd,0 1px 1px #694f3b; }
.tv-dial-grip { position:absolute; inset:10px; transform:rotate(var(--dial-angle,0deg)); transition:transform 300ms cubic-bezier(.2,.9,.25,1); pointer-events:none; }
.tv-dial-grip::before { content:''; position:absolute; top:0; left:21px; width:13px; height:52px; border:1px solid #272922; border-radius:5px; background:linear-gradient(90deg,#242e26,#5e604f 45%,#28352a 85%); box-shadow:2px 3px 0 #232b2380,3px 4px 3px #5d4c3770,inset 0 1px 0 #8a8a6e; }
.tv-dial-grip::after { content:''; position:absolute; top:4px; left:27px; width:2px; height:10px; border-radius:2px; background:#f2e4bc; }
.tv-channel-rocker { display:flex; position:relative; align-items:center; justify-content:center; height:27px; width:119px; margin-top:-4px; }
.tv-channel-rocker span { font-size:10px; letter-spacing:.2em; color:#82725e; }
.tv-channel-rocker button { display:grid; place-items:center; position:absolute; left:-2px; width:40px; height:44px; border:0; background:transparent; border-radius:12px; color:#756b55; }
.tv-channel-rocker button:last-child { left:auto; right:-2px; }
.tv-console svg,.playback-resume svg { width:17px; height:17px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
.tv-channel-rocker svg { width:13px; height:13px; }
.tv-keys { display:grid; gap:9px; width:126px; margin-top:0; }
.tv-key { --key-colour:#c8d0a4; display:flex; align-items:center; gap:10px; position:relative; min-height:44px; width:100%; padding:0 10px 0 0; background:linear-gradient(175deg,#fffbf2 0%,#f4ecdd 55%,#e7dbc4); color:#4b4d3e; font:500 12px/1.2 var(--font); text-align:left; border:1px solid #9e8b70; border-radius:24px; box-shadow:0 1px 0 #c6b596,1px 3px 0 #b7a17f,2px 4px 0 #8e7b60,inset 0 1px 0 #fffef4; transition:translate 100ms,box-shadow 100ms,filter 100ms; cursor:pointer; }
.tv-key-icon { align-self:stretch; display:grid; place-items:center; width:38px; flex:none; min-height:41px; background:var(--key-colour); border-radius:23px 8px 8px 23px; border-right:1px solid #8c84664d; box-shadow:inset 0 1px 0 #ffffff5c; color:#333f33; }
.tv-power { --key-colour:#e5a391; }
.tv-play { --key-colour:#ecd08b; }
.tv-guide { --key-colour:#c5d29f; }
.tv-open { --key-colour:#aecad0; }
.tv-power-light { width:4px; height:4px; margin-left:auto; background:#79904e; border-radius:50%; box-shadow:0 0 0 2px #b4be9755; }
.icon-play { display:none; }
.tv-paused .icon-pause { display:none; }
.tv-paused .icon-play,.playback-resume .icon-play { display:block; }
.playback-resume .icon-pause { display:none; }
.tv-off .tv-power-light { background:#b06249; }
.tv-off .tv-channel-window { color:#94a186; }
.tv-off .tv-channel-window i { background:#708069; box-shadow:none; }
.tv-speaker { position:relative; width:86px; height:73px; margin-top:9px; padding:7px; border:3px double #8c7e66; border-radius:47% 47% 48% 48%; background:linear-gradient(145deg,#f0e6cf,#c9b998); box-shadow:inset 0 2px 1px #fff1d7,1px 2px 0 #8d7c61,2px 3px 1px #b8a78b; }
.tv-speaker i { display:block; height:100%; border-radius:50%; background:repeating-linear-gradient(0deg,#292e25 0 3px,#555441 3px 4px,#d8c8a6 4px 8px); box-shadow:inset 1px 2px 2px #4c423380; }
.tv-chin { grid-column:1 / -1; display:flex; align-items:center; gap:15px; min-height:51px; padding:0 7px 2px; }
.tv-sketch { width:55px; height:25px; fill:none; stroke:#79664d; stroke-width:1.15; stroke-linecap:round; stroke-linejoin:round; }
.tv-wordmark { position:absolute; left:43%; transform:translateX(-50%); font:750 18px 'Segoe Print','Comic Sans MS','Trebuchet MS',sans-serif; letter-spacing:-.03em; white-space:nowrap; color:#4b503f; }
.tv-wordmark b { font:600 10px var(--tv-mono); border:1px solid #6f6c56; padding:2px 3px; border-radius:3px; vertical-align:2px; margin-left:2px; }
.tv-now { margin-left:auto; font-size:10px; color:#85745e; max-width:180px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tv-feet { position:absolute; z-index:2; top:calc(100% - 3px); left:0; right:0; height:33px; pointer-events:none; }
.tv-feet i { position:absolute; left:12%; width:29px; height:30px; transform:skew(-13deg); border:1px solid #766449; border-radius:0 0 6px 4px; background:linear-gradient(100deg,#69523b,#ac824f 42%,#8b693e 75%); box-shadow:inset 0 -7px 0 #3a3c32,2px 2px 0 #665235; }
.tv-feet i:nth-child(2n) { left:auto; right:10%; transform:skew(13deg); }
.tv-feet i:nth-child(3) { left:calc(12% + 25px); top:-7px; height:26px; width:25px; filter:brightness(.84); transform:skew(-13deg); z-index:-1; }
.tv-feet i:nth-child(4) { right:calc(10% - 25px); top:-7px; height:26px; width:25px; filter:brightness(.84); transform:skew(13deg); z-index:-1; }
.tv-hint { position:absolute; top:calc(100% + 61px); left:0; right:0; display:flex; align-items:center; justify-content:center; gap:12px; color:#8b806e; font-size:10px; letter-spacing:.05em; }
.tv-hint i { opacity:.4; font-style:normal; }
.tv-hint kbd { font:10px var(--tv-mono); border:1px solid #c9bfae; border-radius:3px; padding:1px 3px; background:#f8f3e8; }
.playback-resume { position:absolute; z-index:54; bottom:69px; left:50%; transform:translateX(-50%); display:flex; align-items:center; gap:9px; max-width:90%; padding:10px 14px; border:1px solid #aeb693; border-radius:24px; background:#f9f6ebf5; box-shadow:0 3px 12px #1c332620; color:#3e553e; cursor:pointer; font:11px/1.4 var(--font); white-space:nowrap; }
.playback-resume b { font-weight:600; padding-left:5px; }
.playback-resume svg { width:13px; height:13px; }
.playback-resume[hidden] { display:none; }
@media(hover:hover) { .tv-key:hover,.tv-dial:hover { filter:brightness(1.04); } .tv-channel-rocker button:hover { background:#daceb660; } }

.tv-dial:active { translate:1px 2px; }
button:focus-visible,a:focus-visible,input:focus-visible,[tabindex]:focus-visible { outline-color:var(--tv-focus); }
button:disabled { cursor:default; }
.broadcast-id { background:#233d30b8; color:#f5f0df; top:17px; left:20px; padding:7px 10px; border-radius:5px; }
.liveTag { top:18px; right:18px; color:#f5f0df; background:#293d32a3; border-color:#fffff021; }

.chrome-hidden .programme-hud { transform:translateY(8px); }
.m-box { background:#24382c; border-color:#89977388; border-radius:16px; box-shadow:0 15px 35px #15221966; }
.m-head { color:#e7e5c9; border-color:#a2aa8629; }

.m-head .menu-close { min-width:36px; }
